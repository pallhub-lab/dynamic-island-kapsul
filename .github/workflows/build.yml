name: Build APK Dari Zip
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip Proyek
        run: unzip DynamicIsland.zip -d proyek_anda

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Wrapper yang Hilang
        run: |
          cd proyek_anda
          cd $(ls -d */ | head -n 1)
          gradle wrapper --gradle-version 8.7

      - name: Build APK Debug
        run: |
          cd proyek_anda
          cd $(ls -d */ | head -n 1)
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK Jadi
        uses: actions/upload-artifact@v4
        with:
          name: Aplikasi-Dynamic-Island
          path: proyek_anda/**/build/outputs/apk/release/*.apk

